[package]
name = "huginntables"
version = "0.1.0"
description = "HuginnTables — a fast, native-feeling database client"
authors = ["HuginnTables"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "huginntables_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
async-trait = "0.1.92"
anyhow = "1.0.104"
uuid = { version = "1.28.0", features = ["v4"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal", "native-tls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
keyring = "4.2.0"
tauri-plugin-dialog = "2.8.3"
dirs = "7.0.0"
hex = "0.4.3"
redis = { version = "1.7.1", features = ["tokio-comp", "tokio-native-tls-comp"] }
mongodb = "3.9.1"
json5 = "1.3.3"
futures-util = "0.3.34"
regex = "1.13.1"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "native-tls", "charset", "http2"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
